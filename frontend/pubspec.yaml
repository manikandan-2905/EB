name: EB Houses
description: EB Wireman Assistant — save and navigate to electricity consumer service locations.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # GPS / Location
  geolocator: ^12.0.0            # Fetch device GPS coordinates + permission handling

  # Launch external apps (Google Maps)
  url_launcher: ^6.3.0

  # HTTP client for backend API calls
  http: ^1.2.1

  # Utility: date/time formatting
  intl: ^0.19.0

  # Material icons (already included via flutter, but explicit for clarity)
  cupertino_icons: ^1.0.8
  geocoding: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/

